services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${MYSQL_DATABASE:-soucean}"
      DB_USERNAME: "${MYSQL_USER:-soucean}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-change_me}"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-local-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-local-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-local-secret}"
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_HEALTH_HOST: reverb
      REVERB_HEALTH_PORT: "8080"
      APP_KEY_FILE: /var/www/shared/app.key
    depends_on:
      mysql:
        condition: service_healthy
      reverb:
        condition: service_started
    volumes:
      - app_shared:/var/www/shared

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-soucean}"
      MYSQL_USER: "${MYSQL_USER:-soucean}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change_me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change_me_root}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    # For local debugging only, bind MySQL to loopback if you need host access:
    # ports:
    #   - "127.0.0.1:3306:3306"

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${MYSQL_DATABASE:-soucean}"
      DB_USERNAME: "${MYSQL_USER:-soucean}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-change_me}"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-local-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-local-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-local-secret}"
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      APP_KEY_FILE: /var/www/shared/app.key
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_shared:/var/www/shared

  test:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["test"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www/html/backend
    entrypoint: ["sh", "-lc"]
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log
      REVERB_HEALTH_HOST: 127.0.0.1
      REVERB_HEALTH_PORT: "65535"
    command: >
      "rm -rf /tmp/backend
      && mkdir -p /tmp/backend
      && cp -a /var/www/html/backend/. /tmp/backend/
      && cd /tmp/backend
      && composer install --no-interaction --prefer-dist --no-progress
      && php artisan test"

volumes:
  mysql_data:
  app_shared:
